<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cre8tion — Creating tomorrow, today.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fdfdfd;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 700px;
      width: 100%;
      animation: fadeIn 1s ease-out forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 150px;
      height: auto;
      margin-bottom: 40px; 
    }

    .status {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f27047;
      font-weight: 600;
      margin-bottom: 25px; 
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid rgba(242, 112, 71, 0.3);
      border-radius: 50px;
      background: rgba(242, 112, 71, 0.05);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 1.15rem;
      color: #6b7280;
      margin-bottom: 60px; 
      font-weight: 300;
      line-height: 1.7;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 60px; 
      flex-wrap: wrap;
      margin-bottom: 60px;
    }

    .feature {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feature-icon {
      margin-bottom: 16px;
    }

    .feature-icon svg {
      width: 32px;
      height: 32px;
    }

    .feature-title {
      font-size: 1rem;
      color: #374151;
      font-weight: 500;
    }

    .divider {
      width: 50px;
      height: 2px;
      background: #e5e7eb;
      margin: 0 auto 40px auto;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 30px; 
    }

    .socials a {
      color: #9ca3af;
      transition: all 0.3s ease;
      display: inline-block;
    }

    .socials a svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .socials a:hover {
      color: #2b82d4;
      transform: translateY(-3px);
    }

    .contact {
      font-size: 0.95rem;
      color: #6b7280;
      margin-top: 40px;
    }

    .contact a {
      color: #111827;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 2px;
      transition: border-color 0.3s ease;
    }

    .contact a:hover {
      border-color: #f27047;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .features {
        gap: 40px;
      }
    }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="cre8-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2b82d4" />
        <stop offset="100%" stop-color="#f27047" />
      </linearGradient>
    </defs>
  </svg>

  <div class="container">
    <img src="logo.png" alt="Cre8tion" class="logo" />
    
    <span class="status">Now Accepting Projects</span>
    <h1>Creating tomorrow, today.</h1>
    
    <p class="tagline">Empowering brands through innovative technology.<br>Design &bull; Digital Media &bull; Development</p>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon">
          <svg fill="none" stroke="url(#cre8-gradient)" viewBox="0 0 24 24" stroke-width="1.5">

            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 7.125L16.862 4.487" />
          </svg>
        </div>
        <div class="feature-title">Creative Design</div>
      </div>

      <div class="feature">
        <div class="feature-icon">
          <svg fill="none" stroke="url(#cre8-gradient)" viewBox="0 0 24 24" stroke-width="1.5">

          </svg>
        </div>
        <div class="feature-title">App Development</div>
      </div>

      <div class="feature">
        <div class="feature-icon">
          <svg fill="none" stroke="url(#cre8-gradient)" viewBox="0 0 24 24" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112z" />
          </svg>

        <div class="feature-title">Digital Media</div>
      </div>
    </div>

    <div class="divider"></div>

      <a href="https://x.com" aria-label="X">
        <svg viewBox="0 0 24 24">
          <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
        </svg>
      </a>
    </div>

    <div class="contact">
      For inquiries: <a href="mailto:info@cre8tion.com">info@cre8tion.com</a>
    </div>
  </div>
</body>
</html>
