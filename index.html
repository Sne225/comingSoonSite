<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cre8tion — Coming Soon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafb;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 600px;
      width: 100%;
    }

    .logo {
      width: 130px;
      height: auto;
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 400;
      color: #111827;
      margin-bottom: 15px;
      letter-spacing: -0.5px;
    }

    .tagline {
      font-size: 1.1rem;
      color: #6b7280;
      margin-bottom: 40px;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
      margin-bottom: 40px;
    }

    .feature {
      text-align: center;
    }

    .feature-icon {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .feature-title {
      font-size: 0.95rem;
      color: #1f2937;
      font-weight: 500;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 30px;
    }

    .socials a {
      font-size: 22px;
      color: #9ca3af;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .socials a:hover {
      color: #4b5563;
    }

    .contact {
      font-size: 0.95rem;
      color: #6b7280;
      margin-top: 40px;
    }

    .contact a {
      color: #6b7280;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .contact a:hover {
      border-color: #6b7280;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }

      .tagline {
        font-size: 1rem;
      }

      .features {
        gap: 25px;
      }
    }
  </style>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Cre8tion" class="logo" />
    <h1>Coming Soon</h1>
    <p class="tagline">Design. Digital Media. Development.</p>

    <div class="features">
      <div class="feature">
        <div class="feature-icon">✨</div>
        <div class="feature-title">Creative Design</div>
      </div>
      <div class="feature">
        <div class="feature-icon">📱</div>
        <div class="feature-title">App Development</div>
      </div>
      <div class="feature">
        <div class="feature-icon">🎬</div>
        <div class="feature-title">Digital Media</div>
      </div>
    </div>

    <div class="socials">
      <a href="https://linkedin.com" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="https://instagram.com" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com" aria-label="X"><i class="fab fa-twitter"></i></a>
    </div>

    <div class="contact">
      For inquiries: <a href="mailto:info@cre8tion.com">info@cre8tion.com</a>
    </div>
  </div>
</body>
</html>
