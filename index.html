<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cre8tion — Creating tomorrow, today.</title>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #fdfdfd;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 30px;
    }

    /* Added a subtle fade-in animation for a premium feel */
    .container {
      max-width: 650px;
      width: 100%;
      animation: fadeIn 1s ease-out forwards;
      opacity: 0;
      transform: translateY(15px);
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      width: 140px;
      height: auto;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .status {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #f27047; /* Matches the orange in your logo */
      font-weight: 600;
      margin-bottom: 20px;
      display: block;
    }

    .tagline {
      font-size: 1.15rem;
      color: #6b7280;
      margin-bottom: 45px;
      font-weight: 300;
      line-height: 1.6;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 50px;
      flex-wrap: wrap;
      margin-bottom: 45px;
    }

    .feature {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .feature-icon i {
      font-size: 26px;
      margin-bottom: 12px;
      /* Gradient matching the CRE8TION logo */
      background: linear-gradient(135deg, #2b82d4, #f27047);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .feature-title {
      font-size: 0.95rem;
      color: #374151;
      font-weight: 500;
    }

    /* Divider to separate content from footer elements */
    .divider {
      width: 40px;
      height: 2px;
      background: #e5e7eb;
      margin: 0 auto 35px auto;
    }

    .socials {
      display: flex;
      justify-content: center;
      gap: 25px;
    }

    .socials a {
      font-size: 20px;
      color: #9ca3af;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .socials a:hover {
      color: #2b82d4; /* Matches the blue in your logo */
      transform: translateY(-2px);
    }

    .contact {
      font-size: 0.95rem;
      color: #6b7280;
      margin-top: 30px;
    }

    .contact a {
      color: #111827;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid #d1d5db;
      padding-bottom: 2px;
      transition: border-color 0.3s ease;
    }

    .contact a:hover {
      border-color: #f27047;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 1.8rem;
      }
      .tagline {
        font-size: 1rem;
      }
      .features {
        gap: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Cre8tion" class="logo" />
    
    <span class="status">Coming Soon</span>
    <h1>Creating tomorrow, today.</h1>
    <p class="tagline">We are building our new digital experience.<br>Design &bull; Digital Media &bull; Development</p>
    
    <div class="features">
      <div class="feature">
        <div class="feature-icon"><i class="fas fa-pen-nib"></i></div>
        <div class="feature-title">Creative Design</div>
      </div>
      <div class="feature">
        <div class="feature-icon"><i class="fas fa-mobile-alt"></i></div>
        <div class="feature-title">App Development</div>
      </div>
      <div class="feature">
        <div class="feature-icon"><i class="fas fa-video"></i></div>
        <div class="feature-title">Digital Media</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="socials">
      <a href="https://linkedin.com" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
      <a href="https://instagram.com" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://x.com" aria-label="X"><i class="fab fa-twitter"></i></a>
    </div>

    <div class="contact">
      For inquiries: <a href="mailto:info@cre8tion.com">info@cre8tion.com</a>
    </div>
  </div>
</body>
</html>
